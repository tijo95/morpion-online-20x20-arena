<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Morpion 20×20 - Arena Online</title>
    <style>
        :root{--bg:#0b1120;--surface:#1e293b;--primary:#6366f1;--secondary:#ec4899;--success:#10b981;--warning:#f59e0b;--danger:#ef4444;--text:#f8fafc;--cell-size:min(4.5vw,28px)}
        *{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,sans-serif}
        body{background:var(--bg);color:var(--text);min-height:100vh;display:flex;justify-content:center;align-items:center;overflow:hidden}
        .app{display:flex;width:100%;max-width:1400px;height:100vh;gap:16px;padding:12px}
        
        /* SIDEBAR */
        .sidebar{width:300px;background:var(--surface);border-radius:12px;display:flex;flex-direction:column;overflow:hidden;flex-shrink:0}
        .sb-head{padding:16px;border-bottom:1px solid #334155;text-align:center}
        .online{font-size:.8rem;color:var(--success);font-weight:700;margin-top:4px}
        .dot{display:inline-block;width:8px;height:8px;background:var(--success);border-radius:50%;margin-right:4px;animation:pulse 2s infinite}
        .social{padding:12px;border-bottom:1px solid #334155;display:flex;flex-direction:column;gap:8px}
        .row{display:flex;gap:6px}
        .row input{flex:1;background:#0f172a;border:1px solid #334155;color:#fff;padding:8px;border-radius:6px;font-size:.85rem}
        .btn-sm{padding:8px 12px;border:none;border-radius:6px;cursor:pointer;font-weight:600;font-size:.8rem;transition:.2s}
        .btn-inv{background:var(--primary);color:#fff}
        .btn-search{background:var(--success);color:#fff;width:100%;padding:12px;font-size:1rem}
        .btn-search:disabled{background:#334155;cursor:wait}
        .lb{flex:1;overflow-y:auto;padding:8px;scrollbar-width:thin;scrollbar-color:#334155 transparent}
        .lb-i{display:flex;align-items:center;padding:8px;margin-bottom:4px;background:#0f172a;border-radius:6px;font-size:.85rem}
        .lb-r{width:24px;font-weight:700;color:var(--warning)}
        .lb-n{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
        .lb-s{font-weight:700;color:var(--primary)}
        .lb-i.me{border:1px solid var(--warning);background:rgba(245,158,11,.1)}

        /* GAME AREA */
        .game{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--surface);border-radius:12px;padding:12px}
        .nav-link{text-align:center;margin-bottom:8px}
        .nav-link a{color:var(--warning);text-decoration:none;font-weight:700;font-size:.9rem;padding:8px 16px;border:1px solid var(--warning);border-radius:8px;transition:.2s;display:inline-block}
        .nav-link a:hover{background:var(--warning);color:#000}
        .status{background:#0f172a;padding:10px;border-radius:8px;text-align:center;font-weight:600;margin-bottom:8px;min-height:44px;display:flex;align-items:center;justify-content:center;border:1px solid #334155}
        .game-container{display:flex;gap:12px;flex:1;min-height:0}
        .vp{flex:1;background:#0f172a;border-radius:12px;border:2px solid #334155;overflow:auto;position:relative;touch-action:pan-x pan-y;scrollbar-width:thin;scrollbar-color:#334155 #0f172a}
        
        /* CHAT PANEL */
        .chat-panel{width:320px;background:#0f172a;border-radius:12px;border:2px solid #334155;display:flex;flex-direction:column;flex-shrink:0}
        .chat-header{padding:12px;background:#1e293b;font-weight:700;text-align:center;font-size:.9rem;border-bottom:2px solid #334155;border-radius:10px 10px 0 0}
        .chat-messages{flex:1;overflow-y:auto;padding:12px;scrollbar-width:thin;scrollbar-color:#334155 transparent;display:flex;flex-direction:column;gap:8px}
        .chat-msg{padding:10px;background:#1e293b;border-radius:8px;font-size:.85rem;word-wrap:break-word;animation:slideIn .2s ease-out}
        .chat-msg.me{background:rgba(99,102,241,.2);border-left:4px solid var(--primary)}
        .chat-msg.opp{background:rgba(236,72,153,.2);border-left:4px solid var(--secondary)}
        .chat-msg-author{font-weight:700;font-size:.8rem;margin-bottom:4px}
        .chat-msg-author.me{color:var(--primary)}
        .chat-msg-author.opp{color:var(--secondary)}
        .chat-msg-author.global{color:var(--warning)}
        .chat-msg-text{line-height:1.4;word-break:break-word}
        .chat-msg-time{font-size:.7rem;opacity:.6;margin-top:4px;text-align:right}
        .chat-input{display:flex;gap:6px;padding:10px;background:#1e293b;border-top:2px solid #334155;position:relative;border-radius:0 0 10px 10px}
        .chat-input input{flex:1;background:#0f172a;border:1px solid #334155;color:#fff;padding:10px;border-radius:6px;font-size:.85rem}
        .btn-emoji{background:#334155;color:#fff;border:none;padding:8px 12px;border-radius:6px;cursor:pointer;font-size:1.2rem;transition:.2s}
        .btn-emoji:hover{background:#475569}
        .btn-send{background:var(--primary);color:#fff;border:none;padding:8px 14px;border-radius:6px;cursor:pointer;font-size:1.1rem;transition:.2s;font-weight:700}
        .btn-send:hover{filter:brightness(1.2)}
        .emoji-picker{position:absolute;bottom:60px;right:10px;background:#1e293b;border:2px solid #334155;border-radius:12px;padding:12px;display:grid;grid-template-columns:repeat(6,1fr);gap:6px;box-shadow:0 8px 24px rgba(0,0,0,.6);z-index:10;max-width:280px}
        .emoji-picker.hidden{display:none}
        .emoji-item{background:#0f172a;border:none;padding:8px;border-radius:6px;cursor:pointer;font-size:1.4rem;transition:.2s}
        .emoji-item:hover{background:#334155;transform:scale(1.2)}
        @keyframes slideIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
        
        .board{display:grid;grid-template-columns:repeat(20,var(--cell-size));gap:2px;padding:8px;width:max-content;margin:auto;transform-origin:center center}
        .cell{width:var(--cell-size);height:var(--cell-size);background:#1e293b;border-radius:4px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:calc(var(--cell-size)*.6);cursor:pointer;user-select:none;transition:.15s;position:relative}
        .cell:hover:not(.taken):not(.off){background:#334155}
        .cell.x{color:var(--primary);background:rgba(99,102,241,.15)}
        .cell.o{color:var(--secondary);background:rgba(236,72,153,.15)}
        .cell.win{background:var(--success)!important;color:#042f1a;transform:scale(1.05);z-index:2;box-shadow:0 0 15px rgba(16,185,129,.6)}
        .cell.last::after{content:'';position:absolute;inset:2px;border:2px solid var(--warning);border-radius:3px;animation:pulse 2s infinite;z-index:1;pointer-events:none}
        .cell.off{cursor:default;opacity:.8}
        .ctrls{display:flex;gap:8px;margin-top:8px;justify-content:center}
        .btn{padding:10px 16px;border:none;border-radius:8px;font-weight:600;cursor:pointer;transition:.2s;font-size:.9rem}
        .btn-p{background:var(--primary);color:#fff}.btn-s{background:#334155;color:#fff}.btn-d{background:var(--danger);color:#fff}
        .btn:hover:not(:disabled){filter:brightness(1.1);transform:translateY(-1px)}.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}

        /* OVERLAYS */
        .ov{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:100;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
        .mod{background:var(--surface);padding:32px;border-radius:16px;max-width:420px;width:90%;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.5)}
        .mod h2{margin-bottom:16px;color:var(--warning)}
        .mod input{width:100%;padding:14px;border-radius:8px;border:2px solid #334155;background:#0f172a;color:#fff;font-size:1.1rem;margin-bottom:16px;text-align:center}
        .hidden{display:none!important}
        .notif{position:fixed;top:20px;right:20px;background:var(--surface);border-left:4px solid var(--primary);padding:16px 24px;border-radius:8px;z-index:200;transform:translateX(120%);transition:.3s;box-shadow:0 10px 30px rgba(0,0,0,.4);max-width:320px}
        .notif.show{transform:translateX(0)}.notif.acc{border-color:var(--success)}
        .n-acts{display:flex;gap:8px;margin-top:10px}
        @keyframes pulse{0%,100%{opacity:.8}50%{opacity:.3}}
        @media(max-width:900px){
            .app{flex-direction:column}
            .sidebar{width:100%;height:180px;flex-direction:row}
            .lb{display:none}
            .social{flex:1;border-bottom:none;border-right:1px solid #334155}
            .sb-head{writing-mode:vertical-rl;padding:12px 8px;border-bottom:none;border-right:1px solid #334155}
            .chat-panel{display:none}
        }
    </style>
</head>
<body>
    <div id="notif" class="notif"><div id="nCont"></div><div id="nActs" class="n-acts hidden"></div></div>

    <div id="customModal" class="ov hidden">
        <div class="mod" style="max-width:500px">
            <h2>🎨 Personnalisation</h2>
            <div style="text-align:left;margin:20px 0">
                <div style="margin-bottom:20px">
                    <label style="font-weight:700;display:block;margin-bottom:8px">Thème :</label>
                    <select id="themeSelect" style="width:100%;padding:10px;border-radius:6px;background:#0f172a;color:#fff;border:1px solid #334155">
                        <option value="default">Défaut</option>
                        <option value="neon">Néon</option>
                        <option value="retro">Rétro</option>
                        <option value="minimal">Minimaliste</option>
                        <option value="nature">Nature</option>
                    </select>
                </div>
                <div style="margin-bottom:20px">
                    <label style="font-weight:700;display:block;margin-bottom:8px">Symboles :</label>
                    <select id="symbolSelect" style="width:100%;padding:10px;border-radius:6px;background:#0f172a;color:#fff;border:1px solid #334155">
                        <option value="classic">Classique (X / O)</option>
                        <option value="stars">Étoiles (★ / ♦)</option>
                        <option value="elements">Éléments (🔥 / 💧)</option>
                        <option value="shapes">Formes (● / ■)</option>
                        <option value="arrows">Flèches (▲ / ▼)</option>
                        <option value="moon">Soleil/Lune (☀ / ☽)</option>
                    </select>
                </div>
            </div>
            <div style="display:flex;gap:8px">
                <button class="btn btn-p" style="flex:1" id="saveCustomBtn">💾 Sauvegarder</button>
                <button class="btn btn-s" style="flex:1" id="cancelCustomBtn">❌ Annuler</button>
            </div>
        </div>
    </div>

    <div id="login" class="ov">
        <div class="mod">
            <h2>🎮 Morpion 20×20 Arena</h2>
            <input type="text" id="pIn" placeholder="Votre Pseudo" maxlength="15" autocomplete="off">
            <button class="btn btn-p" style="width:100%" id="loginBtn">ENTRER</button>
            <p id="lErr" style="color:var(--danger);margin-top:12px;font-size:.9rem" class="hidden"></p>
        </div>
    </div>

    <div class="app hidden" id="main">
        <aside class="sidebar">
            <div class="sb-head"><div style="font-weight:800;font-size:1.1rem">🏆 Top 100 ELO</div><div class="online"><span class="dot"></span><span id="oCnt">0</span> connecté(s)</div></div>
            <div class="social">
                <button id="sBtn" class="btn-sm btn-search">🔍 RECHERCHER PARTIE</button>
                <div style="text-align:center;font-size:.75rem;opacity:.5;margin:4px 0">OU INVITER</div>
                <div class="row"><input type="text" id="iIn" placeholder="Pseudo..." maxlength="15"><button id="invBtn" class="btn-sm btn-inv">📩</button></div>
            </div>
            <div class="lb" id="lb"></div>
        </aside>
        <main class="game">
            <div class="nav-link">
                <a href="training.html">🤖 Aller au Training Bot</a>
                <button class="btn btn-s" id="customBtn" style="margin-left:8px">🎨 Personnaliser</button>
            </div>
            <div class="status" id="st">En attente...</div>
            <div class="game-container">
                <div class="vp" id="vp"><div class="board" id="bd"></div></div>
                <div class="chat-panel">
                    <div class="chat-header" id="chatHeader">💬 Tchat Global</div>
                    <div class="chat-messages" id="chatMsgs"></div>
                    <div class="chat-input">
                        <input type="text" id="chatIn" placeholder="Message..." maxlength="200">
                        <button id="emojiBtn" class="btn-emoji">😊</button>
                        <button id="chatSend" class="btn-send">📤</button>
                    </div>
                    <div class="emoji-picker hidden" id="emojiPicker"></div>
                </div>
            </div>
            <div class="ctrls">
                <button id="zInBtn" class="btn btn-s">➕</button>
                <button id="zOutBtn" class="btn btn-s">➖</button>
                <button class="btn btn-d" id="ffBtn" disabled>🏳️ Abandon</button>
                <button class="btn btn-p hidden" id="rematchBtn">🔄 Rejouer</button>
                <button class="btn btn-s hidden" id="newGameBtn">🏠 Nouvelle partie</button>
            </div>
        </main>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
        import { getFirestore, doc, setDoc, updateDoc, deleteDoc, onSnapshot, collection, query, orderBy, limit, runTransaction, getDoc, where, getDocs } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA0ACJW1AJi4dzRkp8G5_eNQDbqNvAoR68",
            authDomain: "ti-point-ti-croix.firebaseapp.com",
            projectId: "ti-point-ti-croix",
            storageBucket: "ti-point-ti-croix.firebasestorage.app",
            messagingSenderId: "530932414833",
            appId: "1:530932414833:web:529efe3e441b1a003e9ed0",
            measurementId: "G-9G82QSCD0G"
        };

        const appFirebase = initializeApp(firebaseConfig);
        const db = getFirestore(appFirebase);

        const S = 20, W = 6;

        // ═══════════════════════════════════════════════════════════════
        // SYSTÈME DE RECONNEXION
        // ═══════════════════════════════════════════════════════════════
        const RECONNECTION_TIMEOUT = 180000; // 3 minutes en millisecondes
        const HEARTBEAT_INTERVAL = 15000; // 15 secondes
        const DISCONNECT_THRESHOLD = 45000; // 45 secondes sans heartbeat = déconnecté
        // ═══════════════════════════════════════════════════════════════

        // ═══════════════════════════════════════════════════════════════
        // SYSTÈME DE RANGS ELO
        // ═══════════════════════════════════════════════════════════════
        const RANKS = {
            BRONZE: { name: 'Bronze', icon: '🥉', min: 0, max: 999, color: '#cd7f32' },
            SILVER: { name: 'Argent', icon: '🥈', min: 1000, max: 1399, color: '#c0c0c0' },
            GOLD: { name: 'Or', icon: '🥇', min: 1400, max: 1799, color: '#ffd700' },
            PLATINUM: { name: 'Platine', icon: '💎', min: 1800, max: 2199, color: '#e5e4e2' },
            DIAMOND: { name: 'Diamant', icon: '💠', min: 2200, max: 2599, color: '#b9f2ff' },
            MASTER: { name: 'Maître', icon: '👑', min: 2600, max: 9999, color: '#ff6b6b' }
        };

        const STARTING_ELO = 1200;
        const K_FACTOR = 32; // Facteur K pour le calcul ELO

        function getRankFromElo(elo) {
            for (const [key, rank] of Object.entries(RANKS)) {
                if (elo >= rank.min && elo <= rank.max) {
                    return rank;
                }
            }
            return RANKS.BRONZE;
        }

        function calculateElo(winnerElo, loserElo) {
            const expectedWinner = 1 / (1 + Math.pow(10, (loserElo - winnerElo) / 400));
            const expectedLoser = 1 / (1 + Math.pow(10, (winnerElo - loserElo) / 400));
            
            const newWinnerElo = Math.round(winnerElo + K_FACTOR * (1 - expectedWinner));
            const newLoserElo = Math.round(loserElo + K_FACTOR * (0 - expectedLoser));
            
            return {
                winner: newWinnerElo,
                loser: newLoserElo,
                winnerChange: newWinnerElo - winnerElo,
                loserChange: newLoserElo - loserElo
            };
        }
        // ═══════════════════════════════════════════════════════════════

        // ═══════════════════════════════════════════════════════════════
        // SYSTÈME DE PERSONNALISATION VISUELLE
        // ═══════════════════════════════════════════════════════════════
        const THEMES = {
            default: {
                name: 'Défaut',
                bg: '#0b1120',
                surface: '#1e293b',
                primary: '#6366f1',
                secondary: '#ec4899',
                cell: '#1e293b',
                cellHover: '#334155'
            },
            neon: {
                name: 'Néon',
                bg: '#0a0015',
                surface: '#1a0033',
                primary: '#00ffff',
                secondary: '#ff00ff',
                cell: '#2a0055',
                cellHover: '#3d0077'
            },
            retro: {
                name: 'Rétro',
                bg: '#1a1a1a',
                surface: '#2d2d2d',
                primary: '#ff6b35',
                secondary: '#f7931e',
                cell: '#3d3d3d',
                cellHover: '#4d4d4d'
            },
            minimal: {
                name: 'Minimaliste',
                bg: '#ffffff',
                surface: '#f5f5f5',
                primary: '#000000',
                secondary: '#666666',
                cell: '#e8e8e8',
                cellHover: '#d8d8d8'
            },
            nature: {
                name: 'Nature',
                bg: '#1a2f1a',
                surface: '#2d4a2d',
                primary: '#4caf50',
                secondary: '#8bc34a',
                cell: '#3d5a3d',
                cellHover: '#4d6a4d'
            }
        };

        const SYMBOLS = {
            classic: { x: 'X', o: 'O', name: 'Classique' },
            stars: { x: '★', o: '♦', name: 'Étoiles' },
            elements: { x: '🔥', o: '💧', name: 'Éléments' },
            shapes: { x: '●', o: '■', name: 'Formes' },
            arrows: { x: '▲', o: '▼', name: 'Flèches' },
            moon: { x: '☀', o: '☽', name: 'Soleil/Lune' }
        };

        function applyTheme(themeName) {
            const theme = THEMES[themeName] || THEMES.default;
            const root = document.documentElement;
            
            root.style.setProperty('--bg', theme.bg);
            root.style.setProperty('--surface', theme.surface);
            root.style.setProperty('--primary', theme.primary);
            root.style.setProperty('--secondary', theme.secondary);
            
            // Ajuster le texte pour le thème minimaliste
            if (themeName === 'minimal') {
                root.style.setProperty('--text', '#000000');
            } else {
                root.style.setProperty('--text', '#f8fafc');
            }
            
            localStorage.setItem('m_theme', themeName);
        }

        function applySymbols(symbolSet) {
            const symbols = SYMBOLS[symbolSet] || SYMBOLS.classic;
            localStorage.setItem('m_symbols', symbolSet);
            return symbols;
        }

        function getStoredPreferences() {
            return {
                theme: localStorage.getItem('m_theme') || 'default',
                symbols: localStorage.getItem('m_symbols') || 'classic'
            };
        }
        // ═══════════════════════════════════════════════════════════════

        // ═══════════════════════════════════════════════════════════════
        // SYSTÈME AUDIO DU JEU
        // ═══════════════════════════════════════════════════════════════
        const AUDIO = {
            click: null,
            win: null,
            lose: null,
            notif: null,
            enabled: true
        };

        // Initialisation sécurisée de l'audio
        function initAudio() {
            try {
                AUDIO.click = new Audio("https://assets.mixkit.co/active_storage/sfx/2568/2568-preview.mp3");
                AUDIO.win = new Audio("https://assets.mixkit.co/active_storage/sfx/1435/1435-preview.mp3");
                AUDIO.lose = new Audio("https://assets.mixkit.co/active_storage/sfx/2502/2502-preview.mp3");
                AUDIO.notif = new Audio("https://assets.mixkit.co/active_storage/sfx/911/911-preview.mp3");
                
                // Ajustement des volumes
                AUDIO.click.volume = 0.4;
                AUDIO.win.volume = 0.5;
                AUDIO.lose.volume = 0.4;
                AUDIO.notif.volume = 0.5;
                
                // Préchargement
                Object.values(AUDIO).forEach(sound => {
                    if (sound instanceof Audio) {
                        sound.load();
                    }
                });
                
                console.log('🔊 Audio system initialized');
            } catch (e) {
                console.warn('⚠️ Audio initialization failed:', e);
                AUDIO.enabled = false;
            }
        }

        // Fonction de lecture sécurisée
        function playSound(soundName) {
            if (!AUDIO.enabled || !AUDIO[soundName]) return;
            
            try {
                const sound = AUDIO[soundName];
                sound.currentTime = 0; // Reset pour rejouer rapidement
                sound.play().catch(err => {
                    if (err.name !== 'NotAllowedError') {
                        console.warn(`Could not play ${soundName}:`, err);
                    }
                });
            } catch (e) {
                console.warn(`Error playing ${soundName}:`, e);
            }
        }

        // Initialisation au premier clic utilisateur (contourne le blocage autoplay)
        let audioInitialized = false;
        document.addEventListener('click', () => {
            if (!audioInitialized) {
                initAudio();
                audioInitialized = true;
            }
        }, { once: true });
        // ═══════════════════════════════════════════════════════════════

        // ═══════════════════════════════════════════════════════════════
        // EMOJIS POPULAIRES POUR LE SÉLECTEUR
        // ═══════════════════════════════════════════════════════════════
        const EMOJIS = [
            '😊', '😂', '🤣', '😍', '🥰', '😎',
            '🤔', '😅', '😭', '😡', '🤯', '🥳',
            '👍', '👎', '👏', '🙏', '💪', '🤝',
            '❤️', '🔥', '⭐', '✨', '💯', '🎮',
            '🏆', '🎯', '⚡', '💥', '🎉', '🚀',
            '😈', '👻', '💀', '🤖', '👾', '🎲'
        ];
        // ═══════════════════════════════════════════════════════════════ 

        class App {
            constructor() {
                this.p = localStorage.getItem('m_p') || null;
                this.gs = { id: null, sym: null, bd: Array(S*S).fill(''), act: false, turn: false, z: 1, opp: null };
                this.unsubs = [];
                this.gameUnsub = null;
                this.rematchUnsub = null;
                this.inviteTimeouts = {};
                this.chatUnsub = null;
                this.currentChatMode = 'global';
                
                // Système de reconnexion
                this.reconnectionTimer = null;
                this.opponentPresenceUnsub = null;
                
                // Cache rang pour le tchat
                this.cachedRankIcon = '🥉';
                this.cachedElo = STARTING_ELO;
                this.lastMessageTime = 0; // Anti-spam
                
                // Préférences visuelles
                const prefs = getStoredPreferences();
                this.currentTheme = prefs.theme;
                this.currentSymbols = applySymbols(prefs.symbols);
                applyTheme(this.currentTheme);
                
                if (this.p) this.init();
            }

            login() {
                const v = document.getElementById('pIn').value.trim();
                if (v.length < 2) return this.err('lErr', 'Min 2 chars');
                this.p = v;
                localStorage.setItem('m_p', v);
                this.init();
            }

            async init() {
                document.getElementById('login').classList.add('hidden');
                document.getElementById('main').classList.remove('hidden');

                await setDoc(doc(db, 'presence', this.p), { t: Date.now() });
                
                // NE PAS écraser currentGame ici pour permettre la reconnexion !
                // On utilise merge:true et on n'inclut PAS currentGame
                await setDoc(doc(db, 'players', this.p), { 
                    name: this.p,
                    elo: STARTING_ELO,
                    rank: 'BRONZE'
                }, { merge: true });

                const bd = document.getElementById('bd');
                bd.innerHTML = '';
                for (let i = 0; i < S * S; i++) {
                    const c = document.createElement('div');
                    c.className = 'cell';
                    c.dataset.i = i;
                    c.onclick = () => this.click(i);
                    bd.appendChild(c);
                }

                this.unsubs.push(onSnapshot(collection(db, 'presence'), snap => {
                    const now = Date.now();
                    const activeCount = snap.docs.filter(doc => {
                        const lastSeen = doc.data().t || 0;
                        return (now - lastSeen) < 45000; // Actif si ping dans les 45 dernières secondes
                    }).length;
                    document.getElementById('oCnt').textContent = activeCount;
                    
                    // Nettoyage des présences expirées (>2 minutes)
                    snap.docs.forEach(async doc => {
                        const lastSeen = doc.data().t || 0;
                        if (now - lastSeen > 120000) {
                            await deleteDoc(doc.ref).catch(() => {});
                        }
                    });
                }));

                this.unsubs.push(onSnapshot(query(collection(db, 'players'), orderBy('elo', 'desc'), limit(100)), snap => {
                    const lb = document.getElementById('lb');
                    lb.innerHTML = snap.docs.map((d, i) => {
                        const data = d.data();
                        const elo = data.elo || STARTING_ELO;
                        const rank = getRankFromElo(elo);
                        
                        // Mettre en cache le rang du joueur actuel
                        if (d.id === this.p) {
                            this.cachedRankIcon = rank.icon;
                            this.cachedElo = elo;
                        }
                        
                        const cls = d.id === this.p ? 'lb-i me' : 'lb-i';
                        return `<div class="${cls}">
                            <div class="lb-r">${i + 1}</div>
                            <div class="lb-n">${rank.icon} ${d.id}</div>
                            <div class="lb-s" style="color:${rank.color}">${elo}</div>
                        </div>`;
                    }).join('');
                }));

                this.unsubs.push(onSnapshot(doc(db, 'invitations', this.p), snap => {
                    if (snap.exists()) {
                        const d = snap.data();
                        if (d.status === 'pending') {
                            this.notif(`${d.from} vous invite !`, true,
                                () => this.acceptInv(d.from, d.gameId),
                                () => this.declineInv(d.from)
                            );
                        }
                    }
                }));

                this.unsubs.push(onSnapshot(doc(db, 'players', this.p), async snap => {
                    if (snap.exists()) {
                        const gid = snap.data().currentGame;
                        if (gid && gid !== this.gs.id) {
                            this.loadGame(gid);
                        } else if (!gid && this.gs.id) {
                            await this.reset();
                        }
                    }
                }));

                setInterval(() => setDoc(doc(db, 'presence', this.p), { t: Date.now() }), 15000);
                
                // Initialiser le tchat global
                this.initChat('global');
                
                // Initialiser le sélecteur d'emojis
                this.initEmojiPicker();
                
                // CORRECTION BUG : Vérifier si le joueur a une partie en cours (reconnexion)
                console.log('🔍 Vérification de partie en cours...');
                try {
                    const playerSnap = await getDoc(doc(db, 'players', this.p));
                    console.log('👤 Player data:', playerSnap.exists() ? playerSnap.data() : 'not found');
                    
                    if (playerSnap.exists() && playerSnap.data().currentGame) {
                        const existingGameId = playerSnap.data().currentGame;
                        console.log('🎮 Partie trouvée:', existingGameId);
                        
                        const gameSnap = await getDoc(doc(db, 'games', existingGameId));
                        console.log('📊 Game data:', gameSnap.exists() ? gameSnap.data() : 'not found');
                        
                        if (gameSnap.exists()) {
                            const gameData = gameSnap.data();
                            console.log('📍 Game status:', gameData.st);
                            
                            // Charger la partie si elle est active ou en pause
                            if (gameData.st === 'active' || gameData.st === 'paused_disconnection' || gameData.st === 'waiting' || gameData.st === 'invitation_pending') {
                                console.log('✅ Chargement de la partie...');
                                this.loadGame(existingGameId);
                                this.notif('🔄 Partie en cours retrouvée !');
                            } else {
                                console.log('❌ Partie terminée, nettoyage...');
                                // Si la partie est terminée, nettoyer
                                await updateDoc(doc(db, 'players', this.p), { currentGame: null });
                            }
                        } else {
                            console.log('❌ Partie n\'existe plus, nettoyage...');
                            // Si la partie n'existe plus, nettoyer
                            await updateDoc(doc(db, 'players', this.p), { currentGame: null });
                        }
                    } else {
                        console.log('ℹ️ Pas de partie en cours');
                    }
                } catch (error) {
                    console.error('❌ Erreur lors de la vérification:', error);
                }
            }

            // ═══════════════════════════════════════════════════════════════
            // SYSTÈME DE TCHAT
            // ═══════════════════════════════════════════════════════════════
            
            initEmojiPicker() {
                const picker = document.getElementById('emojiPicker');
                picker.innerHTML = EMOJIS.map(emoji => 
                    `<button class="emoji-item" data-emoji="${emoji}">${emoji}</button>`
                ).join('');
                
                picker.querySelectorAll('.emoji-item').forEach(btn => {
                    btn.onclick = () => {
                        const input = document.getElementById('chatIn');
                        input.value += btn.dataset.emoji;
                        input.focus();
                        picker.classList.add('hidden');
                    };
                });
            }
            
            toggleEmojiPicker() {
                const picker = document.getElementById('emojiPicker');
                picker.classList.toggle('hidden');
            }
            
            initChat(mode) {
                if (this.chatUnsub) {
                    this.chatUnsub();
                    this.chatUnsub = null;
                }
                
                this.currentChatMode = mode;
                const chatHeader = document.getElementById('chatHeader');
                const chatMsgs = document.getElementById('chatMsgs');
                chatMsgs.innerHTML = '';
                
                if (mode === 'global') {
                    chatHeader.textContent = '💬 Tchat Global';
                    
                    // Écouter le tchat global (20 derniers messages)
                    this.chatUnsub = onSnapshot(
                        query(collection(db, 'chat_global'), orderBy('timestamp', 'desc'), limit(20)),
                        snapshot => {
                            const messages = snapshot.docs.reverse().map(d => ({
                                id: d.id,
                                ...d.data()
                            }));
                            this.renderChatMessages(messages, 'global');
                        }
                    );
                } else if (mode === 'private' && this.gs.id) {
                    chatHeader.textContent = `💬 Tchat avec ${this.gs.opp}`;
                    
                    // Écouter le tchat privé de la partie
                    this.chatUnsub = onSnapshot(
                        query(collection(db, `games/${this.gs.id}/chat`), orderBy('timestamp', 'asc')),
                        snapshot => {
                            const messages = snapshot.docs.map(d => ({
                                id: d.id,
                                ...d.data()
                            }));
                            this.renderChatMessages(messages, 'private');
                        }
                    );
                }
            }
            
            renderChatMessages(messages, mode) {
                const chatMsgs = document.getElementById('chatMsgs');
                const shouldScroll = chatMsgs.scrollHeight - chatMsgs.scrollTop <= chatMsgs.clientHeight + 50;
                
                chatMsgs.innerHTML = messages.map(msg => {
                    const isMe = msg.author === this.p;
                    const msgClass = mode === 'global' ? 'chat-msg' : (isMe ? 'chat-msg me' : 'chat-msg opp');
                    const authorClass = mode === 'global' ? 'global' : (isMe ? 'me' : 'opp');
                    const time = new Date(msg.timestamp).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
                    
                    // Récupérer le rang du joueur (optionnel, si disponible dans le message)
                    const rankIcon = msg.rankIcon || '';
                    
                    return `
                        <div class="${msgClass}">
                            <div class="chat-msg-author ${authorClass}">${rankIcon} ${msg.author}</div>
                            <div class="chat-msg-text">${this.escapeHtml(msg.text)}</div>
                            <div class="chat-msg-time">${time}</div>
                        </div>
                    `;
                }).join('');
                
                if (shouldScroll) {
                    chatMsgs.scrollTop = chatMsgs.scrollHeight;
                }
            }
            
            async sendChatMessage() {
                const input = document.getElementById('chatIn');
                const text = input.value.trim();
                
                if (!text || text.length > 200) return;
                
                // Anti-spam : 1 seconde entre chaque message
                const now = Date.now();
                if (now - this.lastMessageTime < 1000) return;
                this.lastMessageTime = now;
                
                // Fermer le sélecteur d'emojis
                document.getElementById('emojiPicker').classList.add('hidden');
                
                // Vider l'input immédiatement pour éviter les doubles envois
                input.value = '';
                
                // Utiliser le rang en cache (mis à jour par le leaderboard)
                const rankIcon = this.cachedRankIcon || '🥉';
                
                const msg = {
                    author: this.p,
                    text: text,
                    timestamp: Date.now(),
                    rankIcon: rankIcon
                };
                
                try {
                    if (this.currentChatMode === 'global') {
                        await setDoc(doc(collection(db, 'chat_global')), msg);
                    } else if (this.currentChatMode === 'private' && this.gs.id) {
                        await setDoc(doc(collection(db, `games/${this.gs.id}/chat`)), msg);
                    }
                    
                    playSound('notif');
                } catch (e) {
                    console.error('Error sending message:', e);
                    // Remettre le texte si l'envoi a échoué
                    input.value = text;
                    this.notif('Erreur lors de l\'envoi du message');
                }
            }
            
            escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            openCustomModal() {
                document.getElementById('themeSelect').value = this.currentTheme;
                document.getElementById('symbolSelect').value = localStorage.getItem('m_symbols') || 'classic';
                document.getElementById('customModal').classList.remove('hidden');
            }

            closeCustomModal() {
                document.getElementById('customModal').classList.add('hidden');
            }

            saveCustomization() {
                const newTheme = document.getElementById('themeSelect').value;
                const newSymbols = document.getElementById('symbolSelect').value;
                
                this.currentTheme = newTheme;
                this.currentSymbols = applySymbols(newSymbols);
                applyTheme(newTheme);
                
                // Re-rendre le plateau avec les nouveaux symboles
                this.render();
                
                this.closeCustomModal();
                this.notif('Personnalisation sauvegardée !');
            }

            async findMatch() {
                const btn = document.getElementById('sBtn');
                btn.disabled = true;
                btn.textContent = '🔍 RECHERCHE...';

                try {
                    const q = query(
                        collection(db, 'games'),
                        where('st', '==', 'waiting'),
                        limit(1)
                    );

                    const snap = await getDocs(q);

                    if (!snap.empty) {
                        const gameDoc = snap.docs[0];
                        const gameId = gameDoc.id;
                        const gameData = gameDoc.data();

                        if (gameData.pX === this.p) {
                            this.notif('Vous êtes déjà dans cette partie !');
                            btn.disabled = false;
                            btn.textContent = '🔍 RECHERCHER PARTIE';
                            return;
                        }

                        await runTransaction(db, async (tx) => {
                            const gSnap = await tx.get(doc(db, 'games', gameId));
                            if (!gSnap.exists() || gSnap.data().st !== 'waiting') {
                                throw new Error('Game no longer available');
                            }
                            tx.update(doc(db, 'games', gameId), { pO: this.p, st: 'active' });
                            tx.update(doc(db, 'players', this.p), { currentGame: gameId });
                            tx.update(doc(db, 'players', gameData.pX), { currentGame: gameId });
                        });

                        this.loadGame(gameId);
                    } else {
                        const gid = `g_${Date.now()}_${Math.random().toString(36).substr(2, 9)}`;
                        await setDoc(doc(db, 'games', gid), {
                            pX: this.p,
                            pO: null,
                            bd: Array(S * S).fill(''),
                            t: 'X',
                            st: 'waiting',
                            w: null,
                            created: Date.now()
                        });
                        await updateDoc(doc(db, 'players', this.p), { currentGame: gid });
                        this.notif('Partie créée, en attente d\'adversaire...');
                        this.loadGame(gid);
                    }
                } catch (e) {
                    console.error(e);
                    this.notif('Erreur lors de la recherche');
                } finally {
                    btn.disabled = false;
                    btn.textContent = '🔍 RECHERCHER PARTIE';
                }
            }

            async invite() {
                const v = document.getElementById('iIn').value.trim();
                if (!v) return this.notif('Entrez un pseudo');
                if (v === this.p) return this.notif('Vous ne pouvez pas vous inviter');

                const targetPlayer = await getDoc(doc(db, 'players', v));
                if (!targetPlayer.exists()) return this.notif('Joueur introuvable');

                const targetPresence = await getDoc(doc(db, 'presence', v));
                if (!targetPresence.exists()) return this.notif('Joueur hors ligne');

                if (targetPlayer.data().currentGame) {
                    return this.notif('Ce joueur est déjà en partie');
                }

                const gid = `g_${Date.now()}_${Math.random().toString(36).substr(2, 9)}`;
                
                await setDoc(doc(db, 'games', gid), {
                    pX: this.p,
                    pO: v,
                    bd: Array(S * S).fill(''),
                    t: 'X',
                    st: 'invitation_pending',
                    w: null,
                    created: Date.now()
                });

                await setDoc(doc(db, 'invitations', v), {
                    from: this.p,
                    gameId: gid,
                    status: 'pending',
                    timestamp: Date.now()
                });

                this.notif(`Invitation envoyée à ${v}`);
                document.getElementById('iIn').value = '';

                this.inviteTimeouts[gid] = setTimeout(async () => {
                    const gameSnap = await getDoc(doc(db, 'games', gid));
                    if (gameSnap.exists() && gameSnap.data().st === 'invitation_pending') {
                        await deleteDoc(doc(db, 'games', gid));
                        await deleteDoc(doc(db, 'invitations', v));
                        this.notif('Invitation expirée');
                    }
                }, 30000);
            }

            async acceptInv(from, gameId) {
                try {
                    await runTransaction(db, async (tx) => {
                        const gSnap = await tx.get(doc(db, 'games', gameId));
                        if (!gSnap.exists() || gSnap.data().st !== 'invitation_pending') {
                            throw new Error('Invitation no longer valid');
                        }
                        tx.update(doc(db, 'games', gameId), { st: 'active' });
                        tx.update(doc(db, 'players', this.p), { currentGame: gameId });
                        tx.update(doc(db, 'players', from), { currentGame: gameId });
                        tx.delete(doc(db, 'invitations', this.p));
                    });
                    this.loadGame(gameId);
                } catch (e) {
                    console.error(e);
                    this.notif('Erreur lors de l\'acceptation');
                }
            }

            async declineInv(from) {
                const invSnap = await getDoc(doc(db, 'invitations', this.p));
                if (invSnap.exists()) {
                    const gameId = invSnap.data().gameId;
                    await deleteDoc(doc(db, 'games', gameId));
                    await deleteDoc(doc(db, 'invitations', this.p));
                    this.notif('Invitation refusée');
                }
            }

            async loadGame(gid) {
                if (this.gameUnsub) this.gameUnsub();

                this.gs.id = gid;
                this.gameUnsub = onSnapshot(doc(db, 'games', gid), async g => {
                    if (!g.exists()) {
                        await this.reset();
                        return;
                    }

                    const d = g.data();
                    this.gs.bd = d.bd || Array(S * S).fill('');
                    this.gs.sym = d.pX === this.p ? 'X' : 'O';
                    this.gs.opp = d.pX === this.p ? d.pO : d.pX;
                    this.gs.turn = d.t === this.gs.sym;
                    this.gs.act = d.st === 'active';

                    this.render(d.lastMove ?? null);

                    const st = document.getElementById('st');
                    const ffBtn = document.getElementById('ffBtn');

                    if (d.st === 'waiting' || d.st === 'invitation_pending') {
                        st.textContent = '⏳ En attente d\'adversaire...';
                        ffBtn.disabled = true;
                    } else if (d.st === 'active') {
                        // Stopper le timer de reconnexion si la partie reprend
                        if (this.reconnectionTimer) {
                            clearInterval(this.reconnectionTimer);
                            this.reconnectionTimer = null;
                        }
                        
                        ffBtn.disabled = false;
                        st.innerHTML = this.gs.turn ? '<span style="color:var(--warning)">⚡ À VOUS DE JOUER</span>' : `⏳ Tour de ${d.t === 'X' ? d.pX : d.pO}`;
                        
                        // Passer en mode tchat privé
                        if (this.currentChatMode !== 'private') {
                            this.initChat('private');
                        }
                        
                        // Surveiller la présence de l'adversaire
                        // Réinitialiser pour relancer la surveillance après une reconnexion
                        if (this.opponentPresenceUnsub) {
                            this.opponentPresenceUnsub();
                            this.opponentPresenceUnsub = null;
                        }
                        this.monitorOpponentPresence();
                    } else if (d.st === 'paused_disconnection') {
                        // Partie en pause à cause d'une déconnexion
                        ffBtn.disabled = false;
                        const disconnectedPlayer = d.disconnectedPlayer;
                        const isMe = disconnectedPlayer === this.p;
                        
                        if (isMe) {
                            st.innerHTML = '<span style="color:var(--warning)">🔌 Reconnexion en cours...</span>';
                            // Si c'est moi qui me reconnecte, reprendre la partie
                            await this.resumeGame();
                        } else {
                            // L'adversaire est déconnecté
                            const deadline = d.reconnectionDeadline || 0;
                            const remaining = Math.max(0, Math.ceil((deadline - Date.now()) / 1000));
                            const minutes = Math.floor(remaining / 60);
                            const seconds = (remaining % 60).toString().padStart(2, '0');
                            st.innerHTML = `<span style="color:var(--warning)">⏸️ PARTIE EN PAUSE<br/>⏳ En attente de reconnexion de <strong>${disconnectedPlayer}</strong><br/>Temps restant : ${minutes}:${seconds}</span>`;
                            
                            // Démarrer le compte à rebours
                            this.startReconnectionCountdown(deadline, disconnectedPlayer);
                        }
                    } else if (d.st === 'finished') {
                        let msg = '';
                        if (d.w === 'draw') {
                            msg = '🤝 ÉGALITÉ';
                        } else if (d.w === this.gs.sym) {
                            if (d.winReason === 'opponent_disconnected') {
                                msg = '🏆 VICTOIRE PAR FORFAIT !';
                            } else {
                                msg = '🏆 VICTOIRE !';
                            }
                            playSound('win'); // Son de victoire
                        } else {
                            if (d.winReason === 'opponent_disconnected') {
                                msg = '😢 DÉFAITE PAR DÉCONNEXION';
                            } else {
                                msg = '😢 DÉFAITE';
                            }
                            playSound('lose'); // Son de défaite
                        }
                        st.innerHTML = `<span style="color:${d.w === this.gs.sym ? 'var(--success)' : d.w === 'draw' ? 'var(--warning)' : 'var(--danger)'}">${msg}</span>`;
                        
                        // Afficher la ligne gagnante pour les deux joueurs
                        if (d.winCells && Array.isArray(d.winCells)) {
                            d.winCells.forEach(cellIndex => {
                                document.querySelector(`.cell[data-i="${cellIndex}"]`)?.classList.add('win');
                            });
                        }
                        
                        ffBtn.disabled = true;
                        ffBtn.classList.add('hidden');
                        
                        const rBtn = document.getElementById('rematchBtn');
                        rBtn.classList.remove('hidden');
                        rBtn.disabled = false;
                        rBtn.textContent = '🔄 Rejouer';

                        const ngBtn = document.getElementById('newGameBtn');
                        ngBtn.classList.remove('hidden');
                        ngBtn.disabled = false;

                        // Mise à jour ELO (seulement pour victoire/défaite, pas égalité)
                        if (d.w && d.w !== 'draw' && !d.eloUpdated) {
                            await this.updateElo(d.w);
                        }

                        this.watchRematch();
                    }
                });
            }

            async click(i) {
                if (!this.gs.act || !this.gs.turn || this.gs.bd[i]) return;
                
                playSound('click'); // Son du clic
                
                const nb = [...this.gs.bd];
                nb[i] = this.gs.sym;
                const r = Math.floor(i / S), c = i % S;
                let win = false;
                let winCells = [];
                
                for (const [dr, dc] of [[0,1],[1,0],[1,1],[1,-1]]) {
                    let ln = [i];
                    for (let d = -1; d <= 1; d += 2) {
                        for (let j = 1; j < W; j++) {
                            const nr = r + dr * j * d, nc = c + dc * j * d;
                            if (nr < 0 || nr >= S || nc < 0 || nc >= S || nb[nr * S + nc] !== this.gs.sym) break;
                            ln.push(nr * S + nc);
                        }
                    }
                    if (ln.length >= W) {
                        win = true;
                        winCells = ln.sort((a, b) => a - b).slice(0, W);
                        break;
                    }
                }
                
                const draw = !win && !nb.includes('');
                const nextTurn = this.gs.sym === 'X' ? 'O' : 'X';
                const u = { bd: nb, t: nextTurn, lastMove: i };
                if (win || draw) { 
                    u.st = 'finished'; 
                    u.w = draw ? 'draw' : this.gs.sym;
                    if (win) u.winCells = winCells;
                }
                await updateDoc(doc(db, 'games', this.gs.id), u);
            }

            async ff() {
                if (!this.gs.id) return;
                playSound('lose'); // Son d'abandon
                await updateDoc(doc(db, 'games', this.gs.id), { st: 'finished', w: this.gs.sym === 'X' ? 'O' : 'X' });
            }

            // ═══════════════════════════════════════════════════════════════
            // SYSTÈME DE RECONNEXION
            // ═══════════════════════════════════════════════════════════════

            monitorOpponentPresence() {
                if (!this.gs.opp || this.opponentPresenceUnsub) return;
                
                this.opponentPresenceUnsub = onSnapshot(doc(db, 'presence', this.gs.opp), async (snap) => {
                    if (!this.gs.id || !this.gs.opp) return;
                    
                    const gameSnap = await getDoc(doc(db, 'games', this.gs.id));
                    if (!gameSnap.exists() || gameSnap.data().st !== 'active') return;
                    
                    const now = Date.now();
                    const lastSeen = snap.exists() ? snap.data().t : 0;
                    const timeSinceLastSeen = now - lastSeen;
                    
                    // Si l'adversaire n'a pas donné signe de vie depuis 45 secondes
                    if (timeSinceLastSeen > DISCONNECT_THRESHOLD) {
                        await this.pauseGameForDisconnection(this.gs.opp);
                    }
                });
            }

            async pauseGameForDisconnection(disconnectedPlayer) {
                if (!this.gs.id) return;
                
                try {
                    const gameRef = doc(db, 'games', this.gs.id);
                    const gameSnap = await getDoc(gameRef);
                    
                    // Vérifier que la partie est toujours active
                    if (!gameSnap.exists() || gameSnap.data().st !== 'active') return;
                    
                    // Mettre la partie en pause
                    await updateDoc(gameRef, {
                        st: 'paused_disconnection',
                        disconnectedPlayer: disconnectedPlayer,
                        disconnectedAt: Date.now(),
                        reconnectionDeadline: Date.now() + RECONNECTION_TIMEOUT
                    });
                    
                    this.notif(`${disconnectedPlayer} s'est déconnecté. Partie en pause.`);
                    playSound('notif');
                } catch (e) {
                    console.error('Error pausing game:', e);
                }
            }

            async resumeGame() {
                console.log('🔄 resumeGame() appelée');
                if (!this.gs.id) {
                    console.log('❌ Pas de gs.id');
                    return;
                }
                
                try {
                    const gameRef = doc(db, 'games', this.gs.id);
                    const gameSnap = await getDoc(gameRef);
                    
                    if (!gameSnap.exists()) {
                        console.log('❌ Game n\'existe pas');
                        return;
                    }
                    const data = gameSnap.data();
                    console.log('📊 Game data:', data);
                    
                    if (data.st === 'paused_disconnection' && data.disconnectedPlayer === this.p) {
                        console.log('✅ Je suis le joueur déconnecté, reprise...');
                        
                        // Vérifier qu'on est dans le délai de reconnexion
                        const now = Date.now();
                        const deadline = data.reconnectionDeadline || 0;
                        console.log('⏱️ Maintenant:', now, 'Deadline:', deadline);
                        
                        if (now > deadline) {
                            // Trop tard, la partie est perdue
                            console.log('❌ Trop tard !');
                            this.notif('❌ Délai de reconnexion dépassé. Partie perdue.');
                            return;
                        }
                        
                        // Reprendre la partie
                        console.log('✅ Reprise de la partie...');
                        await updateDoc(gameRef, {
                            st: 'active',
                            disconnectedPlayer: null,
                            disconnectedAt: null,
                            reconnectionDeadline: null
                        });
                        
                        // Envoyer un message dans le tchat pour notifier l'adversaire
                        if (this.gs.opp) {
                            await setDoc(doc(collection(db, `games/${this.gs.id}/chat`)), {
                                author: 'Système',
                                text: `${this.p} s'est reconnecté. La partie reprend !`,
                                timestamp: Date.now(),
                                rankIcon: '🔌'
                            });
                        }
                        
                        this.notif('✅ Reconnexion réussie ! La partie reprend.');
                        playSound('win');
                    } else {
                        console.log('ℹ️ Pas de reprise nécessaire');
                    }
                } catch (e) {
                    console.error('❌ Error resuming game:', e);
                }
            }

            startReconnectionCountdown(deadline, disconnectedPlayer) {
                // Nettoyer l'ancien timer
                if (this.reconnectionTimer) {
                    clearInterval(this.reconnectionTimer);
                }
                
                this.reconnectionTimer = setInterval(async () => {
                    if (!this.gs.id) {
                        clearInterval(this.reconnectionTimer);
                        return;
                    }
                    
                    const remaining = Math.max(0, Math.ceil((deadline - Date.now()) / 1000));
                    const st = document.getElementById('st');
                    
                    if (remaining > 0) {
                        const minutes = Math.floor(remaining / 60);
                        const seconds = (remaining % 60).toString().padStart(2, '0');
                        st.innerHTML = `<span style="color:var(--warning)">⏸️ PARTIE EN PAUSE<br/>⏳ En attente de reconnexion de <strong>${disconnectedPlayer}</strong><br/>Temps restant : ${minutes}:${seconds}</span>`;
                    } else {
                        // Temps écoulé, victoire par défaut
                        clearInterval(this.reconnectionTimer);
                        
                        const gameSnap = await getDoc(doc(db, 'games', this.gs.id));
                        if (gameSnap.exists() && gameSnap.data().st === 'paused_disconnection') {
                            await updateDoc(doc(db, 'games', this.gs.id), {
                                st: 'finished',
                                w: this.gs.sym, // Victoire pour moi
                                winReason: 'opponent_disconnected'
                            });
                            
                            this.notif('⏱️ Temps écoulé. Victoire par forfait !');
                            playSound('win');
                        }
                    }
                }, 1000);
            }

            // ═══════════════════════════════════════════════════════════════

            async updateElo(winner) {
                try {
                    const gameRef = doc(db, 'games', this.gs.id);
                    const gameSnap = await getDoc(gameRef);
                    const gameData = gameSnap.data();
                    
                    // Déterminer le gagnant et le perdant
                    const winnerPseudo = winner === 'X' ? gameData.pX : gameData.pO;
                    const loserPseudo = winner === 'X' ? gameData.pO : gameData.pX;
                    
                    // Récupérer les ELO actuels
                    const winnerDoc = await getDoc(doc(db, 'players', winnerPseudo));
                    const loserDoc = await getDoc(doc(db, 'players', loserPseudo));
                    
                    const winnerElo = winnerDoc.data().elo || STARTING_ELO;
                    const loserElo = loserDoc.data().elo || STARTING_ELO;
                    
                    // Calculer nouveaux ELO
                    const eloChanges = calculateElo(winnerElo, loserElo);
                    
                    // Mettre à jour les deux joueurs
                    await runTransaction(db, async (tx) => {
                        const winnerRank = getRankFromElo(eloChanges.winner);
                        const loserRank = getRankFromElo(eloChanges.loser);
                        
                        tx.update(doc(db, 'players', winnerPseudo), {
                            elo: eloChanges.winner,
                            rank: winnerRank.name
                        });
                        
                        tx.update(doc(db, 'players', loserPseudo), {
                            elo: eloChanges.loser,
                            rank: loserRank.name
                        });
                        
                        // Marquer que l'ELO a été mis à jour
                        tx.update(gameRef, { eloUpdated: true });
                    });
                    
                    // Afficher le changement d'ELO pour le joueur actuel
                    const change = winner === this.gs.sym ? eloChanges.winnerChange : eloChanges.loserChange;
                    const newElo = winner === this.gs.sym ? eloChanges.winner : eloChanges.loser;
                    const newRank = getRankFromElo(newElo);
                    
                    const changeText = change >= 0 ? `+${change}` : `${change}`;
                    const changeColor = change >= 0 ? 'var(--success)' : 'var(--danger)';
                    
                    this.notif(`${newRank.icon} ELO : ${newElo} (${changeText})`);
                    
                } catch (e) {
                    console.error('Error updating ELO:', e);
                }
            }

            async requestRematch() {
                if (!this.gs.id || !this.gs.opp) return;

                const rematchDocId = [this.p, this.gs.opp].sort().join('_');
                const rematchRef = doc(db, 'rematches', rematchDocId);

                try {
                    await runTransaction(db, async (tx) => {
                        const rematchSnap = await tx.get(rematchRef);
                        
                        if (rematchSnap.exists()) {
                            const data = rematchSnap.data();
                            
                            if (data.requestedBy === this.p) {
                                throw new Error('Vous avez déjà demandé un rematch');
                            }

                            const newGameId = `g_${Date.now()}_${Math.random().toString(36).substr(2, 9)}`;
                            const isX = Math.random() < 0.5;
                            const pX = isX ? this.p : this.gs.opp;
                            const pO = isX ? this.gs.opp : this.p;

                            tx.set(doc(db, 'games', newGameId), {
                                pX: pX,
                                pO: pO,
                                bd: Array(S * S).fill(''),
                                t: 'X',
                                st: 'active',
                                w: null,
                                created: Date.now()
                            });

                            tx.update(doc(db, 'players', this.p), { currentGame: newGameId });
                            tx.update(doc(db, 'players', this.gs.opp), { currentGame: newGameId });
                            tx.delete(rematchRef);
                        } else {
                            tx.set(rematchRef, {
                                requestedBy: this.p,
                                gameId: this.gs.id,
                                timestamp: Date.now()
                            });
                        }
                    });

                    const checkRematch = await getDoc(rematchRef);
                    if (checkRematch.exists()) {
                        this.notif('Demande de rematch envoyée');
                        document.getElementById('rematchBtn').disabled = true;
                        document.getElementById('rematchBtn').textContent = '⏳ En attente...';
                    }
                } catch (e) {
                    console.error(e);
                    if (e.message.includes('déjà demandé')) {
                        this.notif(e.message);
                    } else {
                        this.notif('Erreur lors de la demande');
                    }
                }
            }

            watchRematch() {
                if (this.rematchUnsub) return;

                const rematchDocId = [this.p, this.gs.opp].sort().join('_');
                this.rematchUnsub = onSnapshot(doc(db, 'rematches', rematchDocId), snap => {
                    if (snap.exists() && snap.data().requestedBy !== this.p) {
                        this.notif(`${this.gs.opp} veut rejouer !`, true,
                            () => this.acceptRematch(),
                            () => this.declineRematch()
                        );
                    }
                });
            }

            async acceptRematch() {
                const rematchDocId = [this.p, this.gs.opp].sort().join('_');
                const rematchRef = doc(db, 'rematches', rematchDocId);

                try {
                    await runTransaction(db, async (tx) => {
                        const rematchSnap = await tx.get(rematchRef);
                        if (!rematchSnap.exists()) {
                            throw new Error('Demande de rematch expirée');
                        }

                        const newGameId = `g_${Date.now()}_${Math.random().toString(36).substr(2, 9)}`;
                        const isX = Math.random() < 0.5;
                        const pX = isX ? this.p : this.gs.opp;
                        const pO = isX ? this.gs.opp : this.p;

                        tx.set(doc(db, 'games', newGameId), {
                            pX: pX,
                            pO: pO,
                            bd: Array(S * S).fill(''),
                            t: 'X',
                            st: 'active',
                            w: null,
                            created: Date.now()
                        });

                        tx.update(doc(db, 'players', this.p), { currentGame: newGameId });
                        tx.update(doc(db, 'players', this.gs.opp), { currentGame: newGameId });
                        tx.delete(rematchRef);
                    });
                } catch (e) {
                    console.error(e);
                    this.notif('Erreur lors de l\'acceptation');
                }
            }

            async declineRematch() {
                const rematchDocId = [this.p, this.gs.opp].sort().join('_');
                await deleteDoc(doc(db, 'rematches', rematchDocId));
                this.notif('Rematch refusé');
            }

            async newGame() {
                if (!this.gs.id) return;
                
                const confirmMsg = `Voulez-vous quitter cette partie et en chercher une nouvelle ?`;
                if (!confirm(confirmMsg)) return;
                
                await this.reset();
                this.notif('Vous pouvez maintenant chercher une nouvelle partie');
            }

            async reset() {
                if (this.gameUnsub) { this.gameUnsub(); this.gameUnsub = null; }
                if (this.rematchUnsub) { this.rematchUnsub(); this.rematchUnsub = null; }
                if (this.opponentPresenceUnsub) { this.opponentPresenceUnsub(); this.opponentPresenceUnsub = null; }
                if (this.reconnectionTimer) { clearInterval(this.reconnectionTimer); this.reconnectionTimer = null; }
                
                const oldGameId = this.gs.id;
                this.gs = { id: null, sym: null, bd: Array(S*S).fill(''), act: false, turn: false, z: this.gs.z, opp: null };
                
                document.getElementById('ffBtn').disabled = true;
                document.getElementById('ffBtn').classList.remove('hidden');
                document.getElementById('rematchBtn').classList.add('hidden');
                document.getElementById('newGameBtn').classList.add('hidden');
                document.getElementById('st').textContent = 'En attente...';
                this.render(); 

                // Revenir au tchat global
                this.initChat('global');

                try {
                    // Nettoyer currentGame seulement quand on quitte volontairement
                    console.log('🧹 Reset: nettoyage de currentGame');
                    await updateDoc(doc(db, 'players', this.p), { currentGame: null });
                    
                    if (oldGameId) {
                        const gameSnap = await getDoc(doc(db, 'games', oldGameId));
                        if (gameSnap.exists() && gameSnap.data().st === 'finished') {
                            await deleteDoc(doc(db, 'games', oldGameId));
                        }
                    }
                } catch (e) {
                    console.error('Error in reset:', e);
                }
            }

            render(lastMove = null) {
                document.querySelectorAll('.cell').forEach((c, i) => {
                    const value = this.gs.bd[i] || '';
                    c.className = 'cell';
                    
                    // Utiliser les symboles personnalisés
                    if (value === 'X') {
                        c.textContent = this.currentSymbols.x;
                        c.classList.add('x', 'taken');
                    } else if (value === 'O') {
                        c.textContent = this.currentSymbols.o;
                        c.classList.add('o', 'taken');
                    } else {
                        c.textContent = '';
                    }
                    
                    // Surbrillance du dernier coup
                    if (lastMove !== null && i === lastMove) {
                        c.classList.add('last');
                    }
                    
                    if (this.gs.id && !this.gs.turn) c.classList.add('off');
                });
            }

            zoom(d) {
                this.gs.z = Math.max(.5, Math.min(2.5, this.gs.z + d));
                document.getElementById('bd').style.transform = `scale(${this.gs.z})`;
            }

            notif(m, a, y, n) {
                playSound('notif'); // Son de notification
                const e = document.getElementById('notif');
                document.getElementById('nCont').textContent = m;
                const ac = document.getElementById('nActs');
                if (a) {
                    ac.classList.remove('hidden');
                    ac.innerHTML = `<button class="btn-sm btn-search" id="ny">Oui</button><button class="btn-sm btn-d" id="nn">Non</button>`;
                    document.getElementById('ny').onclick = () => { y(); e.classList.remove('show'); };
                    document.getElementById('nn').onclick = () => { n(); e.classList.remove('show'); };
                    e.classList.add('acc');
                } else {
                    ac.classList.add('hidden');
                    e.classList.remove('acc');
                }
                e.classList.add('show');
                if (!a) setTimeout(() => e.classList.remove('show'), 4000);
            }

            err(id, m) {
                const e = document.getElementById(id); e.textContent = m; e.classList.remove('hidden');
                setTimeout(() => e.classList.add('hidden'), 3000);
            }

            async cleanup() {
                this.unsubs.forEach(u => u());
                if (this.gameUnsub) this.gameUnsub();
                if (this.rematchUnsub) this.rematchUnsub();
                if (this.chatUnsub) this.chatUnsub();
                if (this.opponentPresenceUnsub) this.opponentPresenceUnsub();
                if (this.reconnectionTimer) clearInterval(this.reconnectionTimer);
                Object.values(this.inviteTimeouts).forEach(t => clearTimeout(t));

                try {
                    // Supprimer seulement la présence, PAS le currentGame
                    // (pour permettre la reconnexion)
                    await deleteDoc(doc(db, 'presence', this.p));
                    
                    // NE PAS mettre currentGame à null ici !
                    // await updateDoc(doc(db, 'players', this.p), { currentGame: null });
                } catch (e) {
                    console.error('Cleanup error:', e);
                }
            }
        }

        const gameApp = new App();
        window.app = gameApp; 

        document.getElementById('loginBtn').onclick = () => gameApp.login();
        document.getElementById('sBtn').onclick = () => gameApp.findMatch();
        document.getElementById('invBtn').onclick = () => gameApp.invite();
        document.getElementById('ffBtn').onclick = () => gameApp.ff();
        document.getElementById('rematchBtn').onclick = () => gameApp.requestRematch();
        document.getElementById('newGameBtn').onclick = () => gameApp.newGame();
        document.getElementById('zInBtn').onclick = () => gameApp.zoom(0.15);
        document.getElementById('zOutBtn').onclick = () => gameApp.zoom(-0.15);
        
        document.getElementById('pIn').addEventListener('keypress', e => {
            if (e.key === 'Enter') gameApp.login();
        });

        document.getElementById('customBtn').onclick = () => gameApp.openCustomModal();
        document.getElementById('saveCustomBtn').onclick = () => gameApp.saveCustomization();
        document.getElementById('cancelCustomBtn').onclick = () => gameApp.closeCustomModal();

        document.getElementById('chatSend').onclick = () => gameApp.sendChatMessage();
        document.getElementById('emojiBtn').onclick = () => gameApp.toggleEmojiPicker();
        document.getElementById('chatIn').addEventListener('keypress', e => {
            if (e.key === 'Enter') gameApp.sendChatMessage();
        });

        // Fermer le sélecteur d'emojis quand on clique ailleurs
        document.addEventListener('click', (e) => {
            const picker = document.getElementById('emojiPicker');
            const emojiBtn = document.getElementById('emojiBtn');
            if (!picker.contains(e.target) && e.target !== emojiBtn && !picker.classList.contains('hidden')) {
                picker.classList.add('hidden');
            }
        });

        window.addEventListener('beforeunload', async () => {
            if (gameApp && gameApp.p) {
                await gameApp.cleanup();
            }
        });

        document.addEventListener('visibilitychange', () => {
            if (document.hidden && gameApp && gameApp.p) {
                setDoc(doc(db, 'presence', gameApp.p), { t: Date.now(), away: true });
            } else if (!document.hidden && gameApp && gameApp.p) {
                setDoc(doc(db, 'presence', gameApp.p), { t: Date.now(), away: false });
            }
        });
    </script>
</body>
</html>
